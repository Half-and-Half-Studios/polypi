<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polyπ - Login</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
  }

  header {
    background: #222;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header input {
    margin-left: 5px;
    padding: 5px;
  }

  header button {
    padding: 5px 10px;
    margin-left: 5px;
  }

  .signup-box {
    width: 300px;
    margin: 50px auto;
    background: white;
    padding: 20px;
    border: 1px solid #ccc;
  }

  .signup-box input {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    box-sizing: border-box;
  }

  .signup-box button {
    width: 100%;
    padding: 10px;
    background: green;
    color: white;
    border: none;
  }
</style>
</head>
<body>

  <header>
    <div>Polyπ</div>
    <div>
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      <button>Log In</button>
    </div>
  </header>

  <div class="signup-box">
    <h2>Sign Up</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <input type="password" placeholder="Confirm Password">
    <button>Sign Up</button>
  </div>

</body>
</html>
