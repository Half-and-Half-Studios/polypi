<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polyπ - Login</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
  }

  header {
    background: #222;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header input {
    margin-left: 5px;
    padding: 5px;
  }

  header button {
    padding: 5px 10px;
    margin-left: 5px;
  }

  .signup-box {
    width: 300px;
    margin: 50px auto;
    background: white;
    padding: 20px;
    border: 1px solid #ccc;
  }

  .signup-box input {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    box-sizing: border-box;
  }

  .signup-box button {
    width: 100%;
    padding: 10px;
    background: green;
    color: white;
    border: none;
  }
  .signup-box input.invalid {
    border: 1px solid red;
  }

  .pw-wrap {
    position: relative;
    margin-bottom: 10px;
  }

  .pw-wrap input {
    margin-bottom: 0;
    padding-right: 35px;
  }

  .pw-wrap button {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    padding: 0;
  }
</style>
</head>
<body>

  <header>
    <div>Polyπ</div>
    <div>
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      <button>Log In</button>
    </div>
  </header>

  <div class="signup-box">
    <h2>Sign Up</h2>
    <input type="text" placeholder="Username">
    <input type="email" id="email" placeholder="Email" class="invalid" oninput="checkEmail()">

    <div class="pw-wrap">
      <input type="password" id="pw" placeholder="Password">
      <button type="button" onclick="togglePw()" id="pwToggle">👁</button>
    </div>

    <input type="password" placeholder="Confirm Password">

    <div style="margin-bottom:10px;">
      Gender:
      <label><input type="radio" name="gender" value="male" style="width:auto;"> Male</label>
      <label><input type="radio" name="gender" value="female" style="width:auto;"> Female</label>
    </div>

    <button>Sign up</button>
  </div>

  <script>
    function togglePw() {
      var pw = document.getElementById('pw');
      var btn = document.getElementById('pwToggle');
      if (pw.type === 'password') {
        pw.type = 'text';
        btn.textContent = '🙈';
      } else {
        pw.type = 'password';
        btn.textContent = '👁';
      }
    }

    function checkEmail() {
      var email = document.getElementById('email');
      var valid = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(email.value);
      email.classList.toggle('invalid', !valid);
    }
  </script>

</body>
</html>
