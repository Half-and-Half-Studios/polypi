<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polyπ - Welcome</title>
<link rel="icon" type="image/png" href="../Polyπ Icon.png">
<style>
  body {
    font-family: Arial, sans-serif;
    background: #d9edf7;
    margin: 0;
  }

  header {
    background: #222;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header input {
    padding: 5px;
    margin-left: 5px;
  }

  header button {
    padding: 5px 10px;
    margin-left: 5px;
    background: #2ecc71;
    color: white;
    border: none;
  }

  .hero {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 50px 20px;
  }

  .brand {
    font-size: 110px;
    font-weight: bold;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: #222;
    letter-spacing: -2px;
    display: inline-block;
  }

  .brand .pi {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: bold;
  }

  .signup-box {
    width: 300px;
    margin: 0;
    margin-left: 40px;
    background: white;
    padding: 20px;
    border: 1px solid #999;
  }

  .signup-box h2 {
    margin-top: 0;
  }

  .signup-box input[type="text"],
  .signup-box input[type="email"],
  .signup-box input[type="password"] {
    width: 100%;
    padding: 8px;
    margin-bottom: 5px;
    box-sizing: border-box;
    border: 1px solid #ccc;
  }

  .signup-box input.invalid {
    border: 1px solid red;
  }

  .signup-box input.valid {
    border: 1px solid green;
  }

  .hint {
    font-size: 11px;
    color: #666;
    margin-bottom: 10px;
  }

  .pw-wrap {
    position: relative;
  }

  .pw-wrap input {
    padding-right: 35px;
  }

  .pw-wrap button {
    position: absolute;
    right: 5px;
    top: 6px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
  }

  .strength-bar {
    height: 6px;
    background: #eee;
    margin-bottom: 10px;
  }

  .strength-fill {
    height: 100%;
    width: 0%;
  }

  .signup-box button.submit {
    width: 100%;
    padding: 10px;
    background: green;
    color: white;
    border: none;
    margin-top: 5px;
  }

  .dob-row {
    display: flex;
    gap: 5px;
    margin-bottom: 5px;
  }

  .dob-row select {
    flex: 1;
    padding: 8px 4px;
    border: 1px solid #ccc;
  }
</style>
</head>
<body>

  <header>
    <div></div>
    <div>
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      <button>Log In</button>
    </div>
  </header>

  <div class="hero">
    <div class="brand">Poly<span class="pi">π</span></div>

    <div class="signup-box">
    <h2>Sign Up</h2>

    <input type="text" id="username" placeholder="Username" oninput="checkUsername()">
    <div class="hint" id="usernameHint">at least 3 characters</div>

    <input type="email" id="email" placeholder="Email" oninput="checkEmail()">
    <div class="hint" id="emailHint">example: name@domain.com</div>

    <div class="pw-wrap">
      <input type="password" id="pw" placeholder="Password" oninput="checkPw(); checkConfirmPw();">
      <button type="button" onclick="togglePw()" id="pwToggle">show</button>
    </div>
    <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    <div class="hint" id="pwHint">8+ characters, no spaces, 1 number, 1 symbol</div>

    <input type="password" id="confirmPw" placeholder="Confirm Password" oninput="checkConfirmPw()">
    <div class="hint" id="confirmPwHint"></div>

    <div class="hint">Birth Date:</div>
    <div class="dob-row">
      <select id="dobMonth"></select>
      <select id="dobDay"></select>
      <select id="dobYear"></select>
    </div>

    <div class="hint">Gender:
      <label><input type="radio" name="gender" value="male" style="width:auto;"> Male</label>
      <label><input type="radio" name="gender" value="female" style="width:auto;"> Female</label>
    </div>

    <button class="submit">Sign Up</button>
  </div>
  </div>

  <script>
    var usernameComments = [
      "That's a cool username",
      "🥶🥶🥶",
      "Yo that's a tuff username ",
      "Aura ",
      "Yeah that checks out ",
      "add a couple of numbers to it or sum ",
      "that's funny ",
      "boring aah username😐 ",
      "love this thing"
    ];
    
    var blockedWords = ["fuck", "shit", "bitch", "asshole", "cunt", "dick", "pussy", "bastard", "slut", "whore", "nigger", "idiot", "ass", "dumbass", "dumb", "bitchass", "kurva", "kokot", "debil", "prdel", "n1gger", "nigg3r", "nig", "n1g", "neckhurt", "pica", "curak"];

    function containsBlockedWord(val) {
      var lower = val.toLowerCase();
      return blockedWords.some(function(word) {
        return lower.indexOf(word) !== -1;
      });
    }

    function checkUsername() {
      var username = document.getElementById('username');
      var hint = document.getElementById('usernameHint');
      var val = username.value;

      var allowedChars = /^[A-Za-z0-9_]*$/.test(val);
      var longEnough = val.length >= 3;
      var blocked = containsBlockedWord(val);
      var valid = allowedChars && longEnough && !blocked;

      if (val.length === 0) {
        username.classList.remove('invalid', 'valid');
        hint.textContent = 'at least 3 characters, letters/numbers only';
      } else if (blocked) {
        username.classList.add('invalid');
        username.classList.remove('valid');
        hint.textContent = 'that username isn\'t allowed';
      } else if (!allowedChars) {
        username.classList.add('invalid');
        username.classList.remove('valid');
        hint.textContent = 'no emojis or symbols allowed';
      } else if (valid) {
        username.classList.add('valid');
        username.classList.remove('invalid');
        var pick = usernameComments[Math.floor(Math.random() * usernameComments.length)];
        hint.textContent = pick;
      } else {
        username.classList.add('invalid');
        username.classList.remove('valid');
        hint.textContent = 'needs at least 3 characters';
      }
    }

    function togglePw() {
      var pw = document.getElementById('pw');
      var confirmPw = document.getElementById('confirmPw');
      var btn = document.getElementById('pwToggle');
      if (pw.type === 'password') {
        pw.type = 'text';
        confirmPw.type = 'text';
        btn.textContent = 'hide';
      } else {
        pw.type = 'password';
        confirmPw.type = 'password';
        btn.textContent = 'show';
      }
    }

    var months = ["Month","January","February","March","April","May","June","July","August","September","October","November","December"];
    var monthSelect = document.getElementById('dobMonth');
    months.forEach(function(m, i) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = m;
      monthSelect.appendChild(opt);
    });

    var daySelect = document.getElementById('dobDay');
    var dayOpt0 = document.createElement('option');
    dayOpt0.textContent = 'Day';
    daySelect.appendChild(dayOpt0);
    for (var d = 1; d <= 31; d++) {
      var opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      daySelect.appendChild(opt);
    }

    var yearSelect = document.getElementById('dobYear');
    var yearOpt0 = document.createElement('option');
    yearOpt0.textContent = 'Year';
    yearSelect.appendChild(yearOpt0);
    var currentYear = new Date().getFullYear();
    for (var y = currentYear; y >= currentYear - 100; y--) {
      var opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      yearSelect.appendChild(opt);
    }

    function checkEmail() {
      var email = document.getElementById('email');
      var hint = document.getElementById('emailHint');
      var valid = /^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(email.value);

      if (email.value.length === 0) {
        email.classList.remove('invalid', 'valid');
        hint.textContent = 'example: name@domain.com';
      } else if (valid) {
        email.classList.add('valid');
        email.classList.remove('invalid');
        hint.textContent = 'looks good';
      } else {
        email.classList.add('invalid');
        email.classList.remove('valid');
        hint.textContent = 'enter a valid email like name@domain.com';
      }
    }

    function checkPw() {
      var pw = document.getElementById('pw');
      var hint = document.getElementById('pwHint');
      var fill = document.getElementById('strengthFill');
      var val = pw.value;

      var hasNumber = /[0-9]/.test(val);
      var hasSymbol = /[^A-Za-z0-9]/.test(val);
      var hasSpace = /\s/.test(val);
      var hasEmoji = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2190}-\u{21FF}\u{2B00}-\u{2BFF}]/u.test(val);
      var longEnough = val.length >= 8;
      var valid = hasNumber && hasSymbol && !hasSpace && !hasEmoji && longEnough;

      var score = [hasNumber, hasSymbol, longEnough, val.length >= 12].filter(Boolean).length;
      var pct = val.length === 0 ? 0 : Math.max(20, score * 25);
      fill.style.width = pct + '%';
      fill.style.background = val.length === 0 ? '#eee' : (!valid ? 'red' : (score < 4 ? 'orange' : 'green'));

      if (val.length === 0) {
        pw.classList.remove('invalid', 'valid');
        hint.textContent = '8+ characters, no spaces, 1 number, 1 symbol';
      } else if (hasEmoji) {
        pw.classList.add('invalid');
        pw.classList.remove('valid');
        hint.textContent = 'no emojis allowed';
      } else if (hasSpace) {
        pw.classList.add('invalid');
        pw.classList.remove('valid');
        hint.textContent = 'no spaces allowed';
      } else if (valid) {
        pw.classList.add('valid');
        pw.classList.remove('invalid');
        hint.textContent = 'looks good';
      } else {
        pw.classList.add('invalid');
        pw.classList.remove('valid');
        var missing = [];
        if (!longEnough) missing.push('8+ characters');
        if (!hasNumber) missing.push('a number');
        if (!hasSymbol) missing.push('a symbol');
        hint.textContent = 'needs: ' + missing.join(', ');
      }
    }

    function checkConfirmPw() {
      var pw = document.getElementById('pw');
      var confirmPw = document.getElementById('confirmPw');
      var hint = document.getElementById('confirmPwHint');
      var val = confirmPw.value;

      if (val.length === 0) {
        confirmPw.classList.remove('invalid', 'valid');
        hint.textContent = '';
      } else if (val !== pw.value) {
        confirmPw.classList.add('invalid');
        confirmPw.classList.remove('valid');
        hint.textContent = 'passwords don\'t match';
      } else {
        confirmPw.classList.add('valid');
        confirmPw.classList.remove('invalid');
        hint.textContent = 'yup all good';
      }
    }
  </script>

</body>
</html>
