<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polyπ - Home</title>
<link rel="icon" type="image/png" href="../Polyπ Icon.png">
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: Arial, sans-serif;
    background: #d9edf7;
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ---- header ---- */
  header {
    background: #222;
    color: white;
    padding: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header .left-group {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  header .logo-small {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: bold;
    font-size: 22px;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .nav-links a {
    color: white;
    text-decoration: none;
    font-size: 14px;
  }

  .nav-links a:hover {
    text-decoration: underline;
  }

  header .login-area {
    display: flex;
    align-items: center;
  }

  header input {
    padding: 5px;
    margin-left: 5px;
  }

  header button {
    padding: 5px 10px;
    margin-left: 5px;
    background: #2ecc71;
    color: white;
    border: none;
  }

  /* ---- hero ---- */
  .hero {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 50px 20px;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 15px;
    justify-content: center;
  }

  .brand {
    font-size: 90px;
    font-weight: bold;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: #222;
    letter-spacing: -2px;
  }

  .brand-icon {
    height: 80px;
    width: auto;
  }

  .tagline {
    font-size: 18px;
    color: #333;
    margin-top: 10px;
  }

  .hero-buttons {
    margin-top: 20px;
  }

  .hero-buttons button {
    padding: 12px 26px;
    font-size: 15px;
    border: none;
    color: white;
    cursor: pointer;
    background: #2ecc71;
  }

  /* ---- content wrap ---- */
  .content {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 20px;
    width: 100%;
    flex: 1;
  }

  .panel {
    background: white;
    border: 1px solid #999;
    margin-bottom: 15px;
  }

  .panel-title {
    border-bottom: 2px solid #999;
    padding: 10px 14px;
    font-weight: bold;
    font-size: 16px;
    color: #222;
  }

  .panel-body {
    padding: 14px;
  }

  /* ---- stats ---- */
  .stats-box {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-around;
    gap: 20px;
    text-align: center;
    padding: 55px 15px;
  }

  .stats-box > div {
    min-width: 150px;
  }

  .stat-num {
    display: block;
    font-weight: bold;
    font-size: 20px;
    color: #222;
  }

  .stat-label {
    display: block;
    font-size: 14px;
    color: #666;
    margin-top: 8px;
  }

  /* ---- empty states ---- */
  .empty-state {
    text-align: center;
    color: #666;
    font-size: 14px;
    padding: 25px;
  }

  /* ---- footer ---- */
  footer {
    background: #222;
    color: #ccc;
    padding: 20px;
    margin-top: auto;
    font-size: 12px;
    text-align: center;
  }

  footer a {
    color: #ccc;
    margin: 0 8px;
    text-decoration: none;
  }
</style>
</head>
<body>

  <header>
    <div class="left-group">
      <div class="logo-small">Poly<span class="pi">π</span></div>
      <div class="nav-links">
        <a href="#discover">Discover</a>
        <a href="https://discord.gg/RpzHA4Ny78" target="_blank" rel="noopener">Community</a>
      </div>
    </div>
    <div class="login-area">
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      <button>Log In</button>
    </div>
  </header>

  <div class="hero">
    <div class="brand-row">
      <img src="../Polyπ Icon.png" alt="Polyπ icon" class="brand-icon">
      <div class="brand">Poly<span class="pi">π</span></div>
    </div>
    <div class="tagline">Play theirs.</div>
    <div class="hero-buttons">
      <button>Play Now</button>
    </div>
  </div>

  <div class="content">

    <div class="panel">
      <div class="stats-box">
        <div><span class="stat-num">0</span><span class="stat-label">servers active</span></div>
        <div><span class="stat-num">0</span><span class="stat-label">online now</span></div>
        <div><span class="stat-num">0</span><span class="stat-label">new this week</span></div>
      </div>
    </div>

    <div class="panel" id="discover">
      <div class="panel-title">Featured Games</div>
      <div class="panel-body">
        <div class="empty-state">No featured games yet.</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Categories</div>
      <div class="panel-body">
        <div class="empty-state">No categories yet.</div>
      </div>
    </div>

  </div>

  <footer>
    <div class="logo-small">Poly<span class="pi">π</span></div>
    <div style="margin-top:8px;">
      <a href="#discover">Discover</a>
      <a href="https://discord.gg/RpzHA4Ny78" target="_blank" rel="noopener">Community</a>
      <a href="#">Help</a>
    </div>
  </footer>

</body>
</html>
