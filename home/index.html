<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Polyπ - Home</title>
<link rel="icon" type="image/png" href="../Polyπ Icon.png">
<style>
  html, body {
    height: 100%;
  }

  body {
    font-family: Arial, sans-serif;
    background: #d9edf7;
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    background: #222;
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  header .nav-links {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  header .nav-links a {
    color: white;
    text-decoration: none;
    font-size: 14px;
  }

  header .nav-links a:hover {
    text-decoration: underline;
  }

  header .logo-small {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: bold;
    font-size: 22px;
  }

  header .logo-small .pi {
    font-style: italic;
  }

  header input {
    padding: 5px;
    margin-left: 5px;
  }

  header button {
    padding: 5px 10px;
    margin-left: 5px;
    background: #2ecc71;
    color: white;
    border: none;
  }

  .hero {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 60px;
    padding: 50px 20px;
    text-align: center;
    flex-direction: column;
  }

  .brand {
    font-size: 90px;
    font-weight: bold;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: #222;
    letter-spacing: -2px;
    display: inline-block;
  }

  .brand .pi {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-weight: bold;
  }

  .brand-row {
    display: flex;
    align-items: center;
    gap: 15px;
    justify-content: center;
  }

  .brand-icon {
    height: 80px;
    width: auto;
  }

  .tagline {
    font-size: 18px;
    color: #333;
    margin-top: 10px;
  }

  .hero-buttons {
    margin-top: 20px;
  }

  .hero-buttons button {
    padding: 12px 26px;
    font-size: 15px;
    border: none;
    color: white;
    cursor: pointer;
    margin: 0 6px;
  }

  .btn-play {
    background: #2ecc71;
  }

  .btn-create {
    background: #3498db;
  }

  .section {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  .section h2 {
    border-bottom: 2px solid #999;
    padding-bottom: 8px;
    color: #222;
  }

  .game-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    margin-top: 15px;
  }

  .game-box {
    width: 190px;
    background: white;
    border: 1px solid #999;
  }

  .game-thumb {
    height: 110px;
    background: #ccc;
  }

  .game-box .game-title {
    padding: 6px 8px 2px;
    font-weight: bold;
    font-size: 13px;
    color: #222;
  }

  .game-box .game-plays {
    padding: 0 8px 8px;
    font-size: 11px;
    color: #666;
  }

  .categories {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .categories span {
    background: white;
    border: 1px solid #999;
    padding: 5px 12px;
    font-size: 13px;
    color: #222;
  }

  .stats-box {
    background: white;
    border: 1px solid #999;
    padding: 15px;
    margin-top: 15px;
    display: flex;
    justify-content: space-around;
    text-align: center;
  }

  .stats-box div span {
    display: block;
  }

  .stats-box .stat-num {
    font-weight: bold;
    font-size: 20px;
    color: #222;
  }

  .stats-box .stat-label {
    font-size: 12px;
    color: #666;
  }

  .create-callout {
    background: white;
    border: 1px solid #999;
    padding: 20px;
    margin-top: 15px;
  }

  .create-callout button {
    padding: 10px 20px;
    background: #3498db;
    color: white;
    border: none;
    margin-top: 10px;
  }

  .empty-state {
    background: white;
    border: 1px solid #999;
    padding: 25px;
    margin-top: 15px;
    text-align: center;
    color: #666;
    font-size: 14px;
  }

  footer {
    background: #222;
    color: #ccc;
    padding: 20px;
    margin-top: auto;
    font-size: 12px;
    text-align: center;
  }

  footer a {
    color: #ccc;
    margin: 0 8px;
  }
</style>
</head>
<body>

  <header>
    <div class="logo-small">Poly<span class="pi">π</span></div>
    <div class="nav-links">
      <a href="#discover">Discover</a>
      <a href="#community">Community</a>
    </div>
    <div>
      <input type="text" placeholder="Username">
      <input type="password" placeholder="Password">
      <button>Log In</button>
    </div>
  </header>

  <div class="hero">
    <div class="brand-row">
      <img src="../Polyπ Icon.png" alt="Polyπ icon" class="brand-icon">
      <div class="brand">Poly<span class="pi">π</span></div>
    </div>
    <div class="tagline">Play theirs.</div>
    <div class="hero-buttons">
      <button class="btn-play">Play Now</button>
    </div>
  </div>

  <div class="section">
    <div class="stats-box">
      <div><span class="stat-num">0</span><span class="stat-label">servers active</span></div>
      <div><span class="stat-num">0</span><span class="stat-label">online now</span></div>
      <div><span class="stat-num">0</span><span class="stat-label">new this week</span></div>
    </div>
  </div>

  <div class="section" id="discover">
    <h2>Featured Games</h2>
    <div class="empty-state">No featured games yet.</div>
  </div>

  <div class="section">
    <h2>Categories</h2>
    <div class="empty-state">No categories yet.</div>
  </div>

  <footer id="community">
    <div>Poly<span class="pi">π</span> - © 2026</div>
    <div style="margin-top:8px;">
      <a href="#discover">Discover</a>
      <a href="#community">Community</a>
      <a href="#">Help</a>
    </div>
  </footer>

</body>
</html>
